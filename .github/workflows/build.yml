name: Build fwjz Menu Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Source Code Menu
        run: |
          cat << 'EOF' > fwjz.m
          #import <UIKit/UIKit.h>
          #import <mach/mach.h>
          #import <mach/mach_time.h>

          @interface FWJZManager : NSObject
          @property (nonatomic, strong) UIWindow *overlayWindow;
          @property (nonatomic, strong) UILabel *overlayLabel;
          @property (nonatomic, strong) UIWindow *menuWindow;
          @property (nonatomic, strong) UIView *menuContainer;
          @property (nonatomic, strong) CADisplayLink *displayLink;
          @property (nonatomic, assign) NSInteger frameCount;
          @property (nonatomic, assign) CFTimeInterval lastTime;
          @property (nonatomic, assign) CGFloat hue;
          @property (nonatomic, strong) NSString *customTitle;
          @property (nonatomic, assign) BOOL showFPS;
          @property (nonatomic, assign) BOOL showRAM;
          @property (nonatomic, assign) BOOL showDate;
          + (instancetype)shared;
          - (void)setup;
          @end

          @implementation FWJZManager

          + (instancetype)shared {
              static FWJZManager *inst = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ inst = [[FWJZManager alloc] init]; });
              return inst;
          }

          static double getRAM(void) {
              struct task_vm_info vm;
              mach_msg_type_number_t c = TASK_VM_INFO_COUNT;
              if (task_info(mach_task_self(), TASK_VM_INFO, (task_info_t)&vm, &c) == KERN_SUCCESS) {
                  return (double)vm.phys_footprint / (1024.0 * 1024.0);
              }
              return 0.0;
          }

          - (void)setup {
              self.customTitle = @"fwjz";
              self.showFPS = YES;
              self.showRAM = YES;
              self.showDate = YES;
              self.hue = 0.0;
              self.frameCount = 0;
              self.lastTime = CACurrentMediaTime();

              // 1. Tạo Overlay góc màn hình (cho phép kéo thả)
              self.overlayWindow = [[UIWindow alloc] initWithFrame:CGRectMake(20, 50, 240, 48)];
              self.overlayWindow.windowLevel = UIWindowLevelStatusBar + 100.0;
              self.overlayWindow.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.55];
              self.overlayWindow.layer.cornerRadius = 10.0;
              self.overlayWindow.layer.masksToBounds = YES;
              self.overlayWindow.userInteractionEnabled = YES;

              self.overlayLabel = [[UILabel alloc] initWithFrame:self.overlayWindow.bounds];
              self.overlayLabel.textAlignment = NSTextAlignmentCenter;
              self.overlayLabel.numberOfLines = 2;
              self.overlayLabel.font = [UIFont boldSystemFontOfSize:11.0];
              [self.overlayWindow addSubview:self.overlayLabel];

              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(onPan:)];
              [self.overlayWindow addGestureRecognizer:pan];
              [self.overlayWindow setHidden:NO];

              // 2. Tạo Menu Cài đặt (Ẩn mặc định)
              [self createMenuWindow];

              // 3. Cử chỉ toàn cục: Nhấp 2 lần bằng 3 ngón tay để bật/tắt Menu
              UITapGestureRecognizer *tripleTouch = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleMenu)];
              tripleTouch.numberOfTouchesRequired = 3;
              tripleTouch.numberOfTapsRequired = 2;
              
              // Nạp vào root window của game
              UIWindow *keyWin = [UIApplication sharedApplication].keyWindow ?: [UIApplication sharedApplication].windows.firstObject;
              [keyWin addGestureRecognizer:tripleTouch];

              // 4. Timer đếm frame & RGB
              self.displayLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(onTick:)];
              [self.displayLink addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSRunLoopCommonModes];
          }

          - (void)onPan:(UIPanGestureRecognizer *)p {
              CGPoint tr = [p translationInView:self.overlayWindow.superview];
              self.overlayWindow.center = CGPointMake(self.overlayWindow.center.x + tr.x, self.overlayWindow.center.y + tr.y);
              [p setTranslation:CGPointZero inView:self.overlayWindow.superview];
          }

          - (void)onTick:(CADisplayLink *)l {
              self.hue += 0.01;
              if (self.hue > 1.0) self.hue = 0.0;
              UIColor *rgb = [UIColor colorWithHue:self.hue saturation:1.0 brightness:1.0 alpha:1.0];
              
              self.overlayLabel.textColor = rgb;
              self.overlayWindow.layer.borderColor = rgb.CGColor;
              self.overlayWindow.layer.borderWidth = 1.2;

              if (self.menuContainer) {
                  self.menuContainer.layer.borderColor = rgb.CGColor;
                  self.menuContainer.layer.borderWidth = 1.5;
              }

              self.frameCount++;
              CFTimeInterval now = CACurrentMediaTime();
              if (now - self.lastTime >= 1.0) {
                  NSInteger fps = (NSInteger)round(self.frameCount / (now - self.lastTime));
                  self.frameCount = 0; self.lastTime = now;

                  NSMutableArray *parts = [NSMutableArray array];
                  if (self.showFPS) [parts addObject:[NSString stringWithFormat:@"%ld FPS", (long)fps]];
                  if (self.showRAM) [parts addObject:[NSString stringWithFormat:@"%.0f MB", getRAM()]];
                  
                  NSString *line1 = [NSString stringWithFormat:@"[ %@ ] - %@", self.customTitle, [parts componentsJoinedByString:@" | "]];
                  if (self.showDate) {
                      NSDateFormatter *df = [[NSDateFormatter alloc] init];
                      [df setDateFormat:@"dd/MM/yyyy HH:mm:ss"];
                      self.overlayLabel.text = [NSString stringWithFormat:@"%@\n%@", line1, [df stringFromDate:[NSDate date]]];
                  } else {
                      self.overlayLabel.text = line1;
                  }
              }
          }

          - (void)createMenuWindow {
              self.menuWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.menuWindow.windowLevel = UIWindowLevelAlert + 100.0;
              self.menuWindow.backgroundColor = [UIColor colorWithWhite:0.0 alpha:0.4];
              self.menuWindow.hidden = YES;

              CGFloat w = 310; CGFloat h = 370;
              CGFloat x = (self.menuWindow.bounds.size.width - w) / 2;
              CGFloat y = (self.menuWindow.bounds.size.height - h) / 2;

              self.menuContainer = [[UIView alloc] initWithFrame:CGRectMake(x, y, w, h)];
              self.menuContainer.backgroundColor = [UIColor colorWithRed:0.08 green:0.08 blue:0.1 alpha:0.95];
              self.menuContainer.layer.cornerRadius = 16.0;
              self.menuContainer.layer.masksToBounds = YES;
              [self.menuWindow addSubview:self.menuContainer];

              // Tiêu đề Menu
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 15, w, 24)];
              title.text = @"⚡ FWJZ MENU MOD ⚡";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:16.0];
              title.textAlignment = NSTextAlignmentCenter;
              [self.menuContainer addSubview:title];

              // Đổi Title
              UITextField *tf = [[UITextField alloc] initWithFrame:CGRectMake(20, 50, w - 40, 34)];
              tf.backgroundColor = [UIColor colorWithWhite:0.2 alpha:0.5];
              tf.textColor = [UIColor whiteColor];
              tf.layer.cornerRadius = 8.0;
              tf.textAlignment = NSTextAlignmentCenter;
              tf.font = [UIFont systemFontOfSize:13];
              tf.placeholder = @"Nhập tên tuỳ chỉnh...";
              tf.text = self.customTitle;
              [tf addTarget:self action:@selector(titleChanged:) forControlEvents:UIControlEventEditingChanged];
              [self.menuContainer addSubview:tf];

              // Switches
              [self addSwitchRow:@"Hiện chỉ số FPS" y:95 sel:@selector(fpsToggled:) on:self.showFPS];
              [self addSwitchRow:@"Hiện mức Ram (MB)" y:140 sel:@selector(ramToggled:) on:self.showRAM];
              [self addSwitchRow:@"Hiện Ngày & Giờ" y:185 sel:@selector(dateToggled:) on:self.showDate];

              // Card Thông tin Admin
              UIView *adminBox = [[UIView alloc] initWithFrame:CGRectMake(20, 235, w - 40, 68)];
              adminBox.backgroundColor = [UIColor colorWithWhite:0.15 alpha:0.6];
              adminBox.layer.cornerRadius = 10.0;
              [self.menuContainer addSubview:adminBox];

              UILabel *lblAdmin = [[UILabel alloc] initWithFrame:CGRectMake(10, 8, adminBox.bounds.size.width - 20, 16)];
              lblAdmin.text = @"👨‍💻 ADMIN : FWJZ";
              lblAdmin.textColor = [UIColor cyanColor];
              lblAdmin.font = [UIFont boldSystemFontOfSize:12];
              [adminBox addSubview:lblAdmin];

              UILabel *lblContact = [[UILabel alloc] initWithFrame:CGRectMake(10, 26, adminBox.bounds.size.width - 20, 36)];
              lblContact.numberOfLines = 2;
              lblContact.textColor = [UIColor colorWithWhite:0.85 alpha:1.0];
              lblContact.font = [UIFont systemFontOfSize:11];
              lblContact.text = @"• TikTok: _fwjz\n• Telegram: @fwjz0";
              [adminBox addSubview:lblContact];

              // Nút Đóng Menu
              UIButton *btnClose = [UIButton buttonWithType:UIButtonTypeSystem];
              btnClose.frame = CGRectMake(20, 315, w - 40, 38)];
              btnClose.backgroundColor = [UIColor colorWithRed:0.9 green:0.2 blue:0.3 alpha:0.9];
              [btnClose setTitle:@"ĐÓNG MENU" forState:UIControlStateNormal];
              [btnClose setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btnClose.titleLabel.font = [UIFont boldSystemFontOfSize:13.0];
              btnClose.layer.cornerRadius = 8.0;
              [btnClose addTarget:self action:@selector(toggleMenu) forControlEvents:UIControlEventTouchUpInside];
              [self.menuContainer addSubview:btnClose];
          }

          - (void)addSwitchRow:(NSString *)text y:(CGFloat)y sel:(SEL)sel on:(BOOL)isOn {
              UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(25, y, 180, 31)];
              lbl.text = text;
              lbl.textColor = [UIColor whiteColor];
              lbl.font = [UIFont systemFontOfSize:13];
              [self.menuContainer addSubview:lbl];

              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(self.menuContainer.bounds.size.width - 75, y, 51, 31)];
              sw.on = isOn;
              [sw addTarget:self action:sel forControlEvents:UIControlEventValueChanged];
              [self.menuContainer addSubview:sw];
          }

          - (void)titleChanged:(UITextField *)tf {
              self.customTitle = tf.text.length > 0 ? tf.text : @"fwjz";
          }
          - (void)fpsToggled:(UISwitch *)sw { self.showFPS = sw.on; }
          - (void)ramToggled:(UISwitch *)sw { self.showRAM = sw.on; }
          - (void)dateToggled:(UISwitch *)sw { self.showDate = sw.on; }

          - (void)toggleMenu {
              self.menuWindow.hidden = !self.menuWindow.hidden;
          }

          @end

          __attribute__((constructor)) static void init(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [[FWJZManager shared] setup];
              });
          }
          EOF

      - name: Compile dylib directly with Clang
        run: |
          xcrun -sdk iphoneos clang -target arm64-apple-ios14.0 \
            -dynamiclib -fobjc-arc \
            -framework UIKit -framework QuartzCore -framework CoreGraphics \
            fwjz.m -o fwjz.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fwjz-dylib
          path: fwjz.dylib
